name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  rspec:
    name: RSpec (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}, ancestry ${{ matrix.ancestry }})
    runs-on: ubuntu-latest
    env:
      ANCESTRY_VERSION: ${{ matrix.ancestry }}
      RAILS_VERSION: ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            rails: "~> 7.0"
            ancestry: "~> 4.0"
          - ruby: "3.4"
            rails: "~> 8.0"
            ancestry: "~> 5.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run RSpec
        run: bundle exec rspec
