plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "sig/**/*"
    - "pkg/**/*"
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 3

Rails/ApplicationRecord:
  Exclude:
    - "spec/support/**/*"

Metrics/MethodLength:
  Exclude:
    - "db/migrate/**/*"

# Adjuster implements the tree-resolution algorithm (custodies, escalation,
# phases) as one deliberately cohesive unit, per its design doc; every
# individual method is kept small (see Metrics/MethodLength/AbcSize/
# ParameterLists, all passing here) - only the module's total size is large.
Metrics/ModuleLength:
  Exclude:
    - "lib/custodian/core/adjuster.rb"

Metrics/ClassLength:
  Exclude:
    - "lib/custodian/core/adjuster.rb"

# The full-tree integration spec deliberately builds one large, realistic
# fixture (8 nodes, 9 custodies) to exercise every feature together in a
# single scenario - many memoized helpers and a narrative string instead of
# a class are both intentional here, not signs of a poorly scoped spec.
RSpec/MultipleMemoizedHelpers:
  Exclude:
    - "spec/integration/**/*"

RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
